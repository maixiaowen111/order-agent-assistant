name: CI

# 每次 push 到 master（或开 PR）时触发：自动跑两个后端的单元测试 + 前端生产构建。
# 测试全是纯 Mockito 单元测试、不依赖 Redis/MySQL，换台空机器也能跑绿，正好适合 CI。
on:
  push:
    branches: [master]
  pull_request:

jobs:
  # order-system：状态机 / 脱敏 / 商品图片等
  test-order-system:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test

  # agent：AgentLoop / 权限闸门 / MCP 握手等
  test-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-agent-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test

  # 前端：Vue 3 生产构建（验证编译 / 打包不坏）
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-agent-assistant/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: order-agent-assistant/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # 端到端冒烟：起真中间件（MySQL/Redis）+ 两个后端，验证「代码+中间件+配置」协作。
  # 单测用 Mockito 隔离了中间件，测不到内部密钥配对/收货信息脱敏/写闸门——冒烟补齐这一层。
  # 依赖前三个 job：单元/构建先绿，才值得花时间起 Docker。本地也可跑：bash scripts/smoke.sh
  smoke:
    runs-on: ubuntu-latest
    needs: [test-order-system, test-agent, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke.sh
