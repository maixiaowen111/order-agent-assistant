# 前端 nginx：托管 Vue 构建产物 + 把 API 反代到两个后端
# 浏览器只访问 8082 一个源 → 两个后端都不需要 CORS 配置
server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 业务执行层 order-system :8080
    # 注意：proxy_pass 不带尾部 URI，才能保留 /api/ 前缀
    location /api/ {
        proxy_pass http://order-system:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 商品图片：反代到 order-system 的静态资源映射。
    # 注意：proxy_pass 不带尾部 URI，才能保留 /uploads/ 前缀（同 /api/ 规则）；
    # 否则会把 /uploads/ 替换掉，图片 404。最长前缀匹配，优先级高于 location /。
    location /uploads/ {
        proxy_pass http://order-system:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # AI 决策层 agent :8081，精确匹配，查询串自动透传
    location = /query {
        proxy_pass http://agent:8081/query;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /approve {
        proxy_pass http://agent:8081/approve;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA 路由回退（vue-router history 模式，刷新 /orders 不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 关键：入口 html 必须每次重新校验（no-cache 让浏览器每次都问服务器）。
    # 否则部署新版本后，浏览器缓存住旧 index.html，一直引用旧 JS，看不到新功能。
    # 带 hash 的静态资源（/assets/*.js）文件名变了会拿到新文件，无需管缓存。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
