<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单查询 Agent</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f6f8; }
  .wrap { max-width: 720px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px 20px; background: #1f2937; color: #fff; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 12px; color: #9ca3af; }
  .hint { padding: 12px 20px 0; color: #6b7280; font-size: 12px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 80%; margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: #2563eb; color: #fff; margin-left: auto; border-bottom-right-radius: 2px; }
  .msg.agent { background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 2px; }
  .msg.agent.loading { color: #9ca3af; }
  #confirmBar { display: none; padding: 10px 16px; background: #fef3c7; border-top: 1px solid #fcd34d; }
  #confirmBar .text { font-size: 12px; color: #92400e; margin-bottom: 6px; }
  #confirmBtn { padding: 8px 14px; background: #d97706; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; }
  #confirmBtn:disabled { background: #9ca3af; cursor: not-allowed; }
  .input-row { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid #e5e7eb; }
  #input { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
  #input:focus { outline: none; border-color: #2563eb; }
  #send { padding: 10px 18px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #send:disabled { background: #9ca3af; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>订单查询 Agent</h1>
    <p>自然语言查单 · 多轮对话 · 写操作需确认 · 例：查一下订单 2026073113563149f68e</p>
  </header>
  <div class="hint" id="sessionHint">会话：新建中…</div>
  <div id="chat"></div>
  <div id="confirmBar">
    <div class="text">检测到写操作被拦截，需要人工批准。</div>
    <button id="confirmBtn">批准写操作（本会话）</button>
  </div>
  <div class="input-row">
    <input id="input" placeholder="问点什么，回车发送">
    <button id="send">发送</button>
  </div>
</div>
<script>
  let sessionId = null;

  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const sessionHint = document.getElementById('sessionHint');
  const confirmBar = document.getElementById('confirmBar');
  const confirmBtn = document.getElementById('confirmBtn');

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  async function send() {
    const q = inputEl.value.trim();
    if (!q || sendBtn.disabled) return;
    addMessage('user', q);
    inputEl.value = '';
    confirmBar.style.display = 'none';

    let url = '/query?q=' + encodeURIComponent(q);
    if (sessionId) url += '&sessionId=' + encodeURIComponent(sessionId);

    sendBtn.disabled = true;
    const loading = addMessage('agent', '思考中…');
    loading.classList.add('loading');
    try {
      const resp = await fetch(url);
      const data = await resp.json();
      if (data.sessionId) {
        sessionId = data.sessionId;
        sessionHint.textContent = '会话：' + sessionId;
      }
      loading.textContent = data.answer;
      // 答案里出现"确认"字样，说明有写操作被拦了，亮出批准按钮
      if (data.answer.indexOf('确认') >= 0) {
        confirmBar.style.display = 'block';
      }
    } catch (e) {
      loading.textContent = '调用失败：' + e.message;
    } finally {
      loading.classList.remove('loading');
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function approve() {
    if (!sessionId) return;
    confirmBtn.disabled = true;
    try {
      const resp = await fetch('/approve?sessionId=' + encodeURIComponent(sessionId), { method: 'POST' });
      const data = await resp.json();
      addMessage('agent', '✅ ' + data.result + '（现在重新发一次取消请求，就会真执行）');
    } catch (e) {
      addMessage('agent', '批准失败：' + e.message);
    } finally {
      confirmBtn.disabled = false;
      confirmBar.style.display = 'none';
    }
  }

  sendBtn.onclick = send;
  confirmBtn.onclick = approve;
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
