# ============================================
# 开发环境配置
# ============================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/order_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 密码不写死在仓库里：从环境变量 DB_PASSWORD 读，没配启动直接报错。
    # 本地跑：export DB_PASSWORD=你的密码；docker compose 由 .env 注入。
    password: ${DB_PASSWORD}
  redis:
    host: localhost
    port: 6379
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# 只显示我们自己的日志，框架日志关掉
logging:
  level:
    com.example.order: DEBUG       # 只显示项目代码的日志
    com.baomidou.mybatisplus: WARN # MyBatis-Plus 静音
    org.springframework: WARN      # Spring 静音
    org.redisson: WARN             # Redisson 静音

# 内部接口密钥：order-agent-assistant 调 /internal/** 时要带的 X-Internal-Key
# 从环境变量 INTERNAL_API_KEY 读，不写死在仓库里。两边要保持一致
#（agent 的 order-system.internal-key 也读同一个环境变量）。docker compose 由 .env 注入。
internal-api:
  key: ${INTERNAL_API_KEY}
