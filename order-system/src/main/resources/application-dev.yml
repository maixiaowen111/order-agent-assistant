# ============================================
# 开发环境配置
# ============================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/order_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 密码不写死在仓库里：从环境变量 DB_PASSWORD 读，没配启动直接报错。
    # 本地跑：export DB_PASSWORD=你的密码；docker compose 由 .env 注入。
    password: ${DB_PASSWORD}
  redis:
    host: localhost
    port: 6379
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# 只显示我们自己的日志，框架日志关掉
logging:
  level:
    com.example.order: DEBUG       # 只显示项目代码的日志
    com.baomidou.mybatisplus: WARN # MyBatis-Plus 静音
    org.springframework: WARN      # Spring 静音
    org.redisson: WARN             # Redisson 静音

# 内部接口密钥：order-agent-assistant 调 /internal/** 时要带的 X-Internal-Key
# 从环境变量 INTERNAL_API_KEY 读；本地开发没设时用下面的开发默认值（agent 侧同款默认值，两边自动配对）。
# 生产必须设置 INTERNAL_API_KEY 且不能是默认值——RequiredEnvValidator 在非 dev 环境启动强制校验。
# 信任模型：X-Internal-Key 只证明"是 agent 在调"（服务身份），不是用户身份；用户身份由 X-User-Id 表达。
# 真正的隔离靠部署：/internal/** 只暴露内网，公网防火墙不放行；生产建议升级为内部签名 Token 或 mTLS。
internal-api:
  key: ${INTERNAL_API_KEY:order-agent-internal-key-2026}
