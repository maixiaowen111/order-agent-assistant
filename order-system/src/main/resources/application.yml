# ============================================
# SpringBoot 主配置文件
# 作用：通用配置 + 指定激活的环境
# ============================================

# 激活开发环境配置
spring:
  profiles:
    active: dev

  # 应用名称（微服务阶段会用到，先配好）
  application:
    name: order-system

  # 文件上传：单文件 2MB，总请求 2MB（与 ProductController 的 MAX_IMAGE_BYTES 一致）
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

# 商品图片存储目录（本地默认 ./uploads，Docker 用环境变量 APP_UPLOAD_DIR=/app/uploads 覆盖）
app:
  upload-dir: ./uploads

# 服务器端口
server:
  port: 8080

# JWT 签名密钥：优先读环境变量 JWT_SECRET，没配用开发默认值。
# order-agent-assistant 的 AgentJwtService 用同一个环境变量——两边同钥才能验同一张签。
# 生产必须设 JWT_SECRET，别用默认值。
jwt:
  secret: ${JWT_SECRET:MyOrderSystemSecretKeyForJwtToken2024!!!}

# MyBatis-Plus 通用配置
mybatis-plus:
  # 实体类扫描包路径
  type-aliases-package: com.example.order.entity
  # 下划线转驼峰（数据库字段 user_name → Java属性 userName）
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志在 application-dev.yml 单独控制
  # 全局配置
  global-config:
    db-config:
      # 主键自增策略
      id-type: auto
      # 逻辑删除字段名（后面会用到）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志级别
logging:
  level:
    com.example.order: debug
