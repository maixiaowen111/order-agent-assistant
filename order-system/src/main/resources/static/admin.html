<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - OrderSystem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; }
        .navbar { background: #1a1a2e; }
        .navbar-brand { color: #fff !important; font-weight: 700; }
        .product-table { background: #fff; border-radius: 8px; overflow: hidden; }
        .product-table th { background: #fafafa; font-weight: 600; font-size: 13px; }
        .price { color: #ff4d4f; font-weight: 600; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/index.html">📦 OrderSystem 后台</a>
        <div class="d-flex gap-2">
            <a href="/index.html" class="btn btn-outline-light btn-sm">前台</a>
            <a href="/orders.html" class="btn btn-outline-light btn-sm">订单</a>
        </div>
    </div>
</nav>

<div class="container mt-4" style="max-width: 1000px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">📋 商品管理</h5>
        <button class="btn btn-primary btn-sm" onclick="openCreateModal()">+ 新增商品</button>
    </div>

    <div class="product-table table-responsive">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th>ID</th><th>名称</th><th>分类</th><th>价格</th><th>库存</th><th>状态</th><th>操作</th>
                </tr>
            </thead>
            <tbody id="productTable"><tr><td colspan="7" class="text-center py-4 text-muted">加载中...</td></tr></tbody>
        </table>
    </div>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h6 class="modal-title" id="editTitle">新增商品</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <input type="text" class="form-control mb-2" id="editName" placeholder="商品名称" required>
                <input type="text" class="form-control mb-2" id="editCategory" placeholder="分类（如：手机、电脑）" required>
                <input type="number" class="form-control mb-2" id="editPrice" placeholder="价格" step="0.01" required>
                <input type="number" class="form-control mb-2" id="editStock" placeholder="库存数量" required>
                <textarea class="form-control mb-2" id="editDesc" placeholder="描述（选填）" rows="2"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary w-100" onclick="saveProduct()">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js?v=2"></script>
<script src="/js/api.js?v=2"></script>
<script>

if (!Auth.isLogin()) { window.location.href = '/login.html'; }

loadProducts();

async function loadProducts() {
    try {
        // 管理端查全部商品（包括下架的），用大批量分页
        const result = await API.get('/api/product/admin/page?pageSize=100');
        renderTable(result.records);
    } catch(e) {
        document.getElementById('productTable').innerHTML =
            '<tr><td colspan="7" class="text-center py-4 text-danger">加载失败：' + e.message + '</td></tr>';
    }
}

function renderTable(products) {
    const tbody = document.getElementById('productTable');
    if (!products || products.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">暂无商品</td></tr>';
        return;
    }
    tbody.innerHTML = products.map(p => `
        <tr>
            <td>${p.id}</td>
            <td>${escHtml(p.name)}</td>
            <td>${escHtml(p.category || '—')}</td>
            <td class="price">¥${p.price.toFixed(2)}</td>
            <td>${p.stock}</td>
            <td>
                <span class="badge bg-${p.status === 1 ? 'success' : 'secondary'}">${p.status === 1 ? '上架' : '下架'}</span>
            </td>
            <td>
                <button class="btn btn-outline-secondary btn-sm me-1" onclick="openEditModal(${p.id}, '${escHtml(p.name)}', '${escHtml(p.category||'')}', ${p.price}, ${p.stock}, '${escHtml(p.description||'')}')">编辑</button>
                <button class="btn btn-outline-${p.status === 1 ? 'warning' : 'success'} btn-sm" onclick="toggleStatus(${p.id}, ${p.status === 1 ? 0 : 1})">${p.status === 1 ? '下架' : '上架'}</button>
            </td>
        </tr>
    `).join('');
}

// ========== 新增 ==========
function openCreateModal() {
    document.getElementById('editTitle').textContent = '新增商品';
    document.getElementById('editId').value = '';
    ['editName','editCategory','editPrice','editStock','editDesc'].forEach(id => document.getElementById(id).value = '');
    new bootstrap.Modal(document.getElementById('editModal')).show();
}

// ========== 编辑 ==========
function openEditModal(id, name, cat, price, stock, desc) {
    document.getElementById('editTitle').textContent = '编辑商品';
    document.getElementById('editId').value = id;
    document.getElementById('editName').value = name;
    document.getElementById('editCategory').value = cat;
    document.getElementById('editPrice').value = price;
    document.getElementById('editStock').value = stock;
    document.getElementById('editDesc').value = desc;
    new bootstrap.Modal(document.getElementById('editModal')).show();
}

async function saveProduct() {
    const dto = {
        name: document.getElementById('editName').value,
        category: document.getElementById('editCategory').value,
        price: parseFloat(document.getElementById('editPrice').value),
        stock: parseInt(document.getElementById('editStock').value),
        description: document.getElementById('editDesc').value
    };
    if (!dto.name || !dto.price || !dto.stock) { alert('请填写必填项'); return; }

    const id = document.getElementById('editId').value;
    try {
        if (id) {
            await API.put('/api/product/' + id, dto);
        } else {
            await API.post('/api/product', dto);
        }
        bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
        loadProducts();
    } catch(e) { alert(e.message); }
}

// ========== 上下架 ==========
async function toggleStatus(id, newStatus) {
    try {
        await API.put('/api/product/' + id + '/status?status=' + newStatus);
        loadProducts();
    } catch(e) { alert(e.message); }
}

function escHtml(text) { return (text || '').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/\n/g, ' '); }
</script>
</body>
</html>
