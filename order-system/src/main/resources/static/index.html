<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderSystem — 商品列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; }
        .navbar { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .navbar-brand { font-weight: 700; color: #1677ff !important; }
        .product-card { background: #fff; border: none; border-radius: 8px; overflow: hidden; transition: box-shadow .2s; cursor: pointer; }
        .product-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .product-card .price { color: #ff4d4f; font-size: 20px; font-weight: 700; }
        .product-card .stock { color: #999; font-size: 12px; }
        .badge-status { font-size: 11px; }
        .cart-badge { position: relative; }
        .cart-badge .count { position: absolute; top: -6px; right: -10px; background: #ff4d4f; color: #fff;
                             font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex;
                             align-items: center; justify-content: center; }
        .modal-qty { width: 80px; text-align: center; }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<nav class="navbar navbar-expand sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/index.html">📦 OrderSystem</a>
        <div class="d-flex align-items-center gap-3">
            <a href="/orders.html" class="btn btn-outline-secondary btn-sm">我的订单</a>
            <a href="/cart.html" class="btn btn-outline-secondary btn-sm cart-badge">
                <i class="bi bi-cart3"></i> 购物车
                <span class="count" id="cartCount" style="display:none">0</span>
            </a>
            <span id="userArea" class="text-muted small">
                <a href="/login.html" class="btn btn-primary btn-sm">登录</a>
            </span>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <!-- 分类筛选 -->
    <div class="d-flex gap-2 mb-3 flex-wrap" id="categoryBar">
        <button class="btn btn-outline-primary btn-sm active" onclick="loadProducts(null)">全部</button>
    </div>

    <!-- 商品列表 -->
    <div class="row g-3" id="productList">
        <div class="col-12 text-center py-5 text-muted">加载中...</div>
    </div>

    <!-- 分页 -->
    <nav class="mt-4" id="pagination"></nav>
</div>

<!-- 加入购物车弹窗 -->
<div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h6 class="modal-title" id="modalTitle"></h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="d-flex align-items-center gap-2">
                    <label class="text-nowrap text-muted">数量：</label>
                    <input type="number" class="form-control modal-qty" id="modalQty" value="1" min="1">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary w-100" onclick="addToCart()">加入购物车</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js?v=2"></script>
<script src="/js/api.js?v=2"></script>
<script>

let currentProductId = null;
let currentPage = 1;
let currentCategory = null;

// ========== 初始化 ==========
if (Auth.isLogin()) {
    const adminLink = Auth.isAdmin()
        ? '<a href="/admin.html" class="btn btn-outline-warning btn-sm">⚙ 管理</a>' : '';
    document.getElementById('userArea').innerHTML = `
        ${adminLink}
        <span class="ms-2">👤 ${Auth.getUsername()}</span>
        <button class="btn btn-outline-danger btn-sm ms-2" onclick="Auth.logout()">退出</button>
    `;
    loadCartCount();
}
loadProducts();
loadCategories();

// ========== 加载分类 ==========
async function loadCategories() {
    try {
        const page = await API.get('/api/product/page?pageSize=1', false);
        // 简单地从商品列表中收集分类（实际应该有专门接口）
        const categories = new Set();
        page.records.forEach(p => { if (p.category) categories.add(p.category); });
        const bar = document.getElementById('categoryBar');
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-outline-primary btn-sm';
            btn.textContent = cat;
            btn.onclick = () => { currentCategory = cat; loadProducts(cat); };
            bar.appendChild(btn);
        });
    } catch(e) {}
}

// ========== 加载商品 ==========
async function loadProducts(category, page) {
    page = page || 1;
    currentPage = page;
    let url = `/api/product/page?pageNum=${page}&pageSize=12`;
    if (category) url += `&category=${encodeURIComponent(category)}`;

    try {
        const result = await API.get(url, false);
        renderProducts(result.records);
        renderPagination(result);
    } catch(e) {
        document.getElementById('productList').innerHTML =
            '<div class="col-12 text-center py-5 text-danger">加载失败：' + e.message + '</div>';
    }
}

function renderProducts(products) {
    const container = document.getElementById('productList');
    if (!products || products.length === 0) {
        container.innerHTML = '<div class="col-12 text-center py-5 text-muted">暂无商品</div>';
        return;
    }
    container.innerHTML = products.map(p => `
        <div class="col-6 col-md-4 col-lg-3">
            <div class="product-card p-3">
                <div class="text-center mb-2" style="font-size:40px">📱</div>
                <h6 class="mb-1">${escHtml(p.name)}</h6>
                <div class="price mb-2">¥${p.price.toFixed(2)}</div>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="stock">库存 ${p.stock}</span>
                    ${p.status === 1
                        ? `<button class="btn btn-outline-primary btn-sm" onclick="openCartModal(${p.id}, '${escHtml(p.name)}', ${p.stock})" ${!Auth.isLogin() ? 'disabled title="请先登录"' : ''}>加入购物车</button>`
                        : '<span class="badge bg-secondary badge-status">已下架</span>'}
                </div>
            </div>
        </div>
    `).join('');
}

// ========== 分页 ==========
function renderPagination(result) {
    const nav = document.getElementById('pagination');
    if (result.pages <= 1) { nav.innerHTML = ''; return; }
    let html = '<ul class="pagination justify-content-center">';
    for (let i = 1; i <= result.pages; i++) {
        html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
            <a class="page-link" href="#" onclick="loadProducts(currentCategory, ${i})">${i}</a></li>`;
    }
    html += '</ul>';
    nav.innerHTML = html;
}

// ========== 购物车弹窗 ==========
function openCartModal(productId, name, maxStock) {
    if (!Auth.isLogin()) { window.location.href = '/login.html'; return; }
    currentProductId = productId;
    document.getElementById('modalTitle').textContent = name;
    const qtyInput = document.getElementById('modalQty');
    qtyInput.value = 1;
    qtyInput.max = maxStock;
    new bootstrap.Modal(document.getElementById('cartModal')).show();
}

async function addToCart() {
    const qty = parseInt(document.getElementById('modalQty').value);
    if (qty < 1) { alert('数量最少为1'); return; }
    try {
        await API.post('/api/cart', { productId: currentProductId, quantity: qty });
        bootstrap.Modal.getInstance(document.getElementById('cartModal')).hide();
        loadCartCount();
        alert('已加入购物车');
    } catch(e) { alert(e.message); }
}

// ========== 购物车数量 ==========
async function loadCartCount() {
    if (!Auth.isLogin()) return;
    try {
        const cart = await API.get('/api/cart');
        const badge = document.getElementById('cartCount');
        if (cart && cart.length > 0) {
            badge.style.display = 'flex';
            badge.textContent = cart.length;
        }
    } catch(e) {}
}

function escHtml(text) { return text.replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
</script>
</body>
</html>
