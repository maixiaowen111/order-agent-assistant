<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - OrderSystem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; height: 100vh; display: flex; align-items: center; }
        .card { max-width: 420px; margin: 0 auto; border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .nav-tabs .nav-link { flex: 1; text-align: center; border: none; color: #999; font-weight: 500; padding: 14px; }
        .nav-tabs .nav-link.active { color: #1677ff; border-bottom: 2px solid #1677ff; background: transparent; }
        .btn-primary { background: #1677ff; border: none; padding: 10px; font-weight: 500; }
        .btn-primary:hover { background: #4096ff; }
        #errorMsg { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card p-4">
        <h4 class="text-center mb-1 fw-bold">OrderSystem</h4>
        <p class="text-center text-muted small mb-3">企业订单交易系统</p>

        <ul class="nav nav-tabs mb-3" id="tab" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#loginPane">登录</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#registerPane">注册</button></li>
        </ul>

        <div id="errorMsg" class="alert alert-danger py-2"></div>

        <div class="tab-content">
            <!-- 登录表单 -->
            <div class="tab-pane fade show active" id="loginPane">
                <form id="loginForm">
                    <input type="text" name="username" class="form-control mb-3" placeholder="用户名" required>
                    <input type="password" name="password" class="form-control mb-3" placeholder="密码" required>
                    <button type="submit" class="btn btn-primary w-100">登 录</button>
                </form>
            </div>
            <!-- 注册表单 -->
            <div class="tab-pane fade" id="registerPane">
                <form id="registerForm">
                    <input type="text" name="username" class="form-control mb-3" placeholder="用户名" required>
                    <input type="password" name="password" class="form-control mb-3" placeholder="密码" required>
                    <input type="text" name="phone" class="form-control mb-3" placeholder="手机号" required>
                    <button type="submit" class="btn btn-primary w-100">注 册</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js?v=2"></script>
<script src="/js/api.js?v=2"></script>
<script>
const errorBox = document.getElementById('errorMsg');

function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }
function hideError() { errorBox.style.display = 'none'; }

// ========== 登录 ==========
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); hideError();
    const form = e.target;
    try {
        const user = await API.post('/api/user/login', {
            username: form.username.value,
            password: form.password.value
        });
        Auth.save(user);
        // 管理员 → 管理后台，普通用户 → 商品页
        window.location.href = user.role === 'ADMIN' ? '/admin.html' : '/index.html';
    } catch (err) { showError(err.message); }
});

// ========== 注册 ==========
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault(); hideError();
    const form = e.target;
    try {
        await API.post('/api/user/register', {
            username: form.username.value,
            password: form.password.value,
            phone: form.phone.value
        }, false);  // 注册不需要鉴权
        alert('注册成功，请登录');
        form.reset();
        // 切回登录 tab
        document.querySelector('#tab button:first-child').click();
    } catch (err) { showError(err.message); }
});
</script>
</body>
</html>
